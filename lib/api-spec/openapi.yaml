openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public storefront product catalogue
  - name: custom-inquiries
    description: Customer requests for made-to-measure jacket quotes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published jackets
      responses:
        "200":
          description: Published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a jacket by its slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Jacket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /custom-inquiries:
    post:
      operationId: createCustomInquiry
      tags: [custom-inquiries]
      summary: Request a made-to-measure jacket quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomInquiryInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomInquiry"
        "400":
          description: Invalid inquiry
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        priceCents:
          type: integer
        currency:
          type: string
        leatherType:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        sizes:
          type: array
          items:
            type: string
        productionDays:
          type: integer
        badge:
          type: [string, "null"]
        featured:
          type: boolean
      required:
        - id
        - slug
        - name
        - category
        - description
        - priceCents
        - currency
        - leatherType
        - color
        - imageUrl
        - sizes
        - productionDays
        - featured
    CustomInquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        country:
          type: string
          minLength: 2
          maxLength: 100
        message:
          type: string
          minLength: 10
          maxLength: 4000
        productSlug:
          type: [string, "null"]
        leatherType:
          type: [string, "null"]
        color:
          type: [string, "null"]
        size:
          type: [string, "null"]
        measurements:
          type: [string, "null"]
      required:
        - name
        - email
        - country
        - message
    CustomInquiry:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [received]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - createdAt

